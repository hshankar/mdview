name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -F "static let version = \"$version\"" Sources/MDView/CLI.swift

      - name: Run tests
        run: swift test

      - name: Package universal release
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/package-release.sh "$version" dist

      - name: Test packaged installer
        run: |
          version="${GITHUB_REF_NAME#v}"
          MDVIEW_ARCHIVE="$PWD/dist/mdview-$version-macos-universal.tar.gz" \
          MDVIEW_CHECKSUM_FILE="$PWD/dist/mdview-$version-macos-universal.tar.gz.sha256" \
          MDVIEW_INSTALL_DIR="$RUNNER_TEMP/mdview/bin" \
          MDVIEW_APP_DIR="$RUNNER_TEMP/mdview/Applications" \
          MDVIEW_REGISTER_APP=0 \
            sh install.sh
          test "$("$RUNNER_TEMP/mdview/bin/mdview" --version)" = "mdview $version"
          codesign --verify --deep --strict "$RUNNER_TEMP/mdview/Applications/MDView.app"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --verify-tag \
            --generate-notes \
            --title "mdview $version"
