name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Validate version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -F "static let version = \"$version\"" Sources/MDView/CLI.swift

      - name: Run tests
        run: swift test

      - name: Build universal binary from source
        run: |
          swift build -c release --arch arm64 --arch x86_64
          bin_path="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          lipo -archs "$bin_path/mdview" | grep -q arm64
          lipo -archs "$bin_path/mdview" | grep -q x86_64

      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "mdview $version"
