name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Run tests
        run: swift test

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          bin_path="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          lipo -archs "$bin_path/mdview" | grep -q arm64
          lipo -archs "$bin_path/mdview" | grep -q x86_64

  intel-build:
    runs-on: macos-15-intel
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build and execute Intel binary
        run: |
          test "$(uname -m)" = x86_64
          swift build -c release
          .build/release/mdview --version
